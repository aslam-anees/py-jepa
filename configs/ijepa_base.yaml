# I-JEPA base configuration
# Usage: pyjepa train ijepa --config configs/ijepa_base.yaml

model:
  type: ijepa
  encoder: vit_base           # vit_tiny | vit_small | vit_base | vit_large | vit_huge
  predictor: vit_predictor
  img_size: 224
  patch_size: 16
  pred_depth: 6
  pred_embed_dim: 384
  num_mask_tokens: 2
  use_mask_tokens: true
  zero_init_mask_tokens: true
  use_sdpa: true

mask:
  type: multiblock
  num_enc_masks: 1
  num_pred_masks: 4
  min_keep: 10
  allow_overlap: false
  enc_mask_scale: [0.85, 1.0]
  pred_mask_scale: [0.15, 0.2]
  aspect_ratio: [0.75, 1.5]

training:
  output_dir: ./output/ijepa_base
  device: auto                # auto | cuda | mps | cpu | cuda:0
  seed: 42
  epochs: 300
  batch_size: 512
  log_every: 50               # steps between metric logs
  save_every_epochs: 10
  keep_last_ckpts: 3
  resume: true                # auto-resume from last checkpoint if present

  # Optimizer
  lr: 1.0e-3
  start_lr: 2.0e-4            # linear warmup from start_lr → lr
  final_lr: 1.0e-6            # cosine decay from lr → final_lr
  weight_decay: 0.04
  warmup_epochs: 40

  # EMA (target encoder momentum schedule)
  momentum_start: 0.996
  momentum_end: 1.0

  # Loss
  loss_exp: 1.0               # exponent on prediction loss (1=L2, 2=L4)
  reg_coeff: 0.0              # variance regularizer weight (0 = disabled)

  # Mixed precision
  amp_dtype: float16          # float16 | bfloat16 | float32
  grad_clip: 10.0

  # torch.compile (CUDA only; set false on MPS)
  compile_model: false
